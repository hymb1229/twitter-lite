<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社交+直播平台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; }
    
    .navbar { background: #fff; border-bottom: 1px solid #ddd; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .navbar-brand { font-size: 20px; font-weight: bold; color: #e1306c; }
    .navbar-links { display: flex; gap: 20px; }
    .navbar-links a { text-decoration: none; color: #666; font-size: 14px; }
    .navbar-links a:hover { color: #e1306c; }
    
    .container { max-width: 1200px; margin: 20px auto; display: grid; grid-template-columns: 250px 1fr 300px; gap: 20px; padding: 0 20px; }
    
    .sidebar { background: #fff; border-radius: 10px; padding: 20px; height: fit-content; }
    .sidebar-menu-item { padding: 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; color: #333; }
    .sidebar-menu-item:hover { background: #f5f5f5; }
    .sidebar-menu-item.active { background: #ffeef5; color: #e1306c; }
    
    .main { background: #fff; border-radius: 10px; overflow: hidden; }
    .main-header { padding: 15px 20px; border-bottom: 1px solid #eee; font-weight: bold; font-size: 16px; }
    
    .post-create { padding: 20px; border-bottom: 1px solid #eee; display: flex; gap: 12px; }
    .post-create textarea { width: 100%; border: none; resize: none; outline: none; font-size: 16px; min-height: 60px; }
    .post-create-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .post-create-actions input { display: none; }
    .btn { padding: 8px 20px; border-radius: 20px; border: none; cursor: pointer; font-weight: 500; }
    .btn-primary { background: #e1306c; color: #fff; }
    .btn-primary:hover { background: #c8235c; }
    .btn-secondary { background: #eee; color: #333; }
    
    .post { padding: 20px; border-bottom: 1px solid #eee; display: flex; gap: 12px; }
    .post-avatar { width: 48px; height: 48px; border-radius: 50%; background: #ddd; flex-shrink: 0; }
    .post-content { flex: 1; }
    .post-header { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
    .post-name { font-weight: bold; }
    .post-username { color: #666; }
    .post-time { color: #999; font-size: 13px; }
    .post-text { margin: 8px 0; line-height: 1.5; }
    .post-image { width: 100%; border-radius: 10px; margin-top: 10px; }
    .post-actions { display: flex; gap: 30px; margin-top: 12px; }
    .post-action { display: flex; align-items: center; gap: 6px; color: #666; cursor: pointer; }
    .post-action:hover { color: #e1306c; }
    
    .right-sidebar { background: #fff; border-radius: 10px; padding: 20px; }
    .right-sidebar h3 { font-size: 16px; margin-bottom: 15px; }
    .live-card { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee; }
    .live-thumb { width: 80px; height: 60px; background: #333; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; }
    .live-info { flex: 1; }
    .live-title { font-weight: 500; font-size: 14px; }
    .live-viewer { font-size: 12px; color: #999; }
    .live-badge { background: #e1306c; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; }
    
    .auth-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .auth-modal.show { display: flex; }
    .auth-box { background: #fff; border-radius: 16px; padding: 30px; width: 400px; max-width: 90%; }
    .auth-box h2 { text-align: center; margin-bottom: 20px; }
    .auth-box input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
    .auth-box .btn { width: 100%; margin-top: 10px; }
    .auth-switch { text-align: center; margin-top: 15px; color: #666; font-size: 14px; }
    .auth-switch span { color: #e1306c; cursor: pointer; }
    
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #333; color: #fff; padding: 12px 24px; border-radius: 8px; opacity: 0; transition: 0.3s; z-index: 2000; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.success { background: #4caf50; }
    .toast.error { background: #f44336; }
    
    @media (max-width: 900px) {
      .container { grid-template-columns: 1fr; }
      .right-sidebar { display: none; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">🌐 Social+Live</div>
    <div class="navbar-links">
      <a href="#" onclick="showPage('home')">首页</a>
      <a href="#" onclick="showPage('live')">直播</a>
      <a href="#" onclick="showPage('profile')" id="profileLink" style="display:none">我的</a>
      <a href="#" onclick="showAuthModal()" id="loginLink">登录</a>
    </div>
  </nav>

  <div class="container">
    <div class="sidebar">
      <div class="sidebar-menu-item active" onclick="loadPosts()">
        🏠 首页
      </div>
      <div class="sidebar-menu-item" onclick="showPage('explore')">
        🔍 探索
      </div>
      <div class="sidebar-menu-item" onclick="showPage('live')">
        📺 直播
      </div>
      <div class="sidebar-menu-item" onclick="showPage('notifications')">
        🔔 通知
      </div>
    </div>

    <div class="main">
      <div class="main-header">首页</div>
      <div class="post-create" id="postCreateBox" style="display:none">
        <div class="post-avatar" id="myAvatar" style="background: linear-gradient(135deg, #e1306c, #fd5949);"></div>
        <div style="flex:1">
          <textarea id="postContent" placeholder="分享新鲜事..."></textarea>
          <div class="post-create-actions">
            <div>
              <button class="btn btn-secondary" onclick="document.getElementById('postImage').click()">🖼️ 图片</button>
              <input type="file" id="postImage" accept="image/*" onchange="handleImage(this)">
            </div>
            <button class="btn btn-primary" onclick="createPost()">发布</button>
          </div>
        </div>
      </div>
      <div id="postsList">
        <!-- Posts will be loaded here -->
      </div>
    </div>

    <div class="right-sidebar">
      <h3>🔴 正在直播</h3>
      <div id="liveList">
        <div style="color: #999; font-size: 14px;">暂无直播</div>
      </div>
    </div>
  </div>

  <!-- Auth Modal -->
  <div class="auth-modal" id="authModal">
    <div class="auth-box">
      <h2 id="authTitle">登录</h2>
      <div id="loginForm">
        <input type="email" id="loginEmail" placeholder="邮箱">
        <input type="password" id="loginPassword" placeholder="密码">
        <button class="btn btn-primary" onclick="login()">登录</button>
        <div class="auth-switch">没有账号？<span onclick="showRegister()">注册</span></div>
      </div>
      <div id="registerForm" style="display:none">
        <input type="text" id="regUsername" placeholder="用户名">
        <input type="text" id="regDisplayName" placeholder="显示名称">
        <input type="email" id="regEmail" placeholder="邮箱">
        <input type="password" id="regPassword" placeholder="密码（至少6位）">
        <button class="btn btn-primary" onclick="register()">注册</button>
        <div class="auth-switch">已有账号？<span onclick="showLogin()">登录</span></div>
      </div>
      <div class="auth-switch" style="margin-top:15px"><span onclick="closeAuthModal()">关闭</span></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = 'https://twitter-lite-15zm.onrender.com/api';
    let currentUser = null;
    let token = localStorage.getItem('token');

    // Initialize
    init();

    function init() {
      if (token) checkAuth();
      loadPosts();
      loadLive();
    }

    // Auth
    async function checkAuth() {
      try {
        const res = await fetch(`${API}/auth/me`, { headers: { Authorization: `Bearer ${token}` } });
        if (res.ok) {
          const data = await res.json();
          currentUser = data.user;
          updateUI();
        }
      } catch (e) {
        console.log('Not logged in');
      }
    }

    function updateUI() {
      if (currentUser) {
        document.getElementById('loginLink').style.display = 'none';
        document.getElementById('profileLink').style.display = 'block';
        document.getElementById('postCreateBox').style.display = 'flex';
        document.getElementById('myAvatar').style.background = `url(${currentUser.avatar}) center/cover`;
      }
    }

    function showAuthModal() { document.getElementById('authModal').classList.add('show'); }
    function closeAuthModal() { document.getElementById('authModal').classList.remove('show'); }
    function showRegister() { document.getElementById('loginForm').style.display = 'none'; document.getElementById('registerForm').style.display = 'block'; document.getElementById('authTitle').textContent = '注册'; }
    function showLogin() { document.getElementById('registerForm').style.display = 'none'; document.getElementById('loginForm').style.display = 'block'; document.getElementById('authTitle').textContent = '登录'; }

    async function login() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      
      const res = await fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      
      const data = await res.json();
      if (res.ok) {
        token = data.token;
        currentUser = data.user;
        localStorage.setItem('token', token);
        updateUI();
        closeAuthModal();
        showToast('登录成功', 'success');
        loadPosts();
      } else {
        showToast(data.error, 'error');
      }
    }

    async function register() {
      const username = document.getElementById('regUsername').value;
      const display_name = document.getElementById('regDisplayName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      
      const res = await fetch(`${API}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, display_name, email, password })
      });
      
      const data = await res.json();
      if (res.ok) {
        token = data.token;
        currentUser = data.user;
        localStorage.setItem('token', token);
        updateUI();
        closeAuthModal();
        showToast('注册成功', 'success');
      } else {
        showToast(data.error, 'error');
      }
    }

    // Posts
    async function loadPosts() {
      const res = await fetch(`${API}/posts`);
      const data = await res.json();
      
      if (data.posts && data.posts.length > 0) {
        document.getElementById('postsList').innerHTML = data.posts.map(post => `
          <div class="post">
            <div class="post-avatar" style="background: url(${post.avatar}) center/cover;"></div>
            <div class="post-content">
              <div class="post-header">
                <span class="post-name">${post.display_name || post.username}</span>
                <span class="post-username">@${post.username}</span>
                <span class="post-time">· ${formatTime(post.created_at)}</span>
              </div>
              <div class="post-text">${post.content}</div>
              ${post.image_url ? `<img class="post-image" src="${API.replace('/api', '')}${post.image_url}" alt="">` : ''}
              <div class="post-actions">
                <div class="post-action" onclick="likePost(${post.id})">❤️ ${post.likes_count || 0}</div>
                <div class="post-action" onclick="retweetPost(${post.id})">🔄 ${post.retweets_count || 0}</div>
                <div class="post-action" onclick="commentPost(${post.id})">💬 ${post.comments_count || 0}</div>
              </div>
            </div>
          </div>
        `).join('');
      } else {
        <div class="post" style="text-align:center;color:#999">暂无内容</div>
      }
    }

    async function createPost() {
      if (!token) return showAuthModal();
      
      const content = document.getElementById('postContent').value;
      if (!content.trim()) return showToast('请输入内容', 'error');
      
      const formData = new FormData();
      formData.append('content', content);
      
      const fileInput = document.getElementById('postImage');
      if (fileInput.files[0]) formData.append('media', fileInput.files[0]);
      
      const res = await fetch(`${API}/posts`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}` },
        body: formData
      });
      
      if (res.ok) {
        document.getElementById('postContent').value = '';
        fileInput.value = '';
        showToast('发布成功', 'success');
        loadPosts();
      } else {
        showToast('发布失败', 'error');
      }
    }

    function handleImage(input) {
      if (input.files[0]) showToast('已选择图片: ' + input.files[0].name, 'success');
    }

    async function likePost(id) {
      if (!token) return showAuthModal();
      await fetch(`${API}/posts/${id}/like`, { method: 'POST', headers: { Authorization: `Bearer ${token}` } });
      loadPosts();
    }

    async function retweetPost(id) {
      if (!token) return showAuthModal();
      await fetch(`${API}/posts/${id}/retweet`, { method: 'POST', headers: { Authorization: `Bearer ${token}` } });
      loadPosts();
    }

    async function commentPost(id) {
      showToast('评论功能开发中', 'success');
    }

    // Live
    async function loadLive() {
      try {
        const res = await fetch(`${API}/live/list`);
        const data = await res.json();
        
        if (data.rooms && data.rooms.length > 0) {
          document.getElementById('liveList').innerHTML = data.rooms.map(room => `
            <div class="live-card">
              <div class="live-thumb">🔴 LIVE</div>
              <div class="live-info">
                <div class="live-title">${room.title}</div>
                <div class="live-viewer">@${room.username} · 🔴 ${room.viewer_count || 0}人观看</div>
              </div>
            </div>
          `).join('');
        }
      } catch (e) {}
    }

    // Utils
    function formatTime(date) {
      const d = new Date(date);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return '刚刚';
      if (diff < 3600) return Math.floor(diff/60) + '分钟';
      if (diff < 86400) return Math.floor(diff/3600) + '小时';
      return Math.floor(diff/86400) + '天';
    }

    function showToast(msg, type = '') {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast show ' + type;
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function showPage(page) {
      showToast('页面: ' + page);
    }
  </script>
</body>
</html>
